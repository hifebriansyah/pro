<style>
  /* The palette comes from the logo (logo.svg): its three ambers, #f59e0b (the line), #fbbf24 and #d97706 (the dots), on warm stone greys.
     --accent is the amber for backgrounds (buttons) with --on-accent text on it; --ink is the amber for icons and --link for links, darker
     in light mode and lighter in dark mode so they stay readable on the panels and bubbles. Pairs checked for WCAG contrast:
     text 4.5:1 on every surface, muted text 4.5:1 or more, links 4.5:1, on-accent 8:1. */
  :root {
    color-scheme: light;
    --bg: #e7e2da; --panel: #ffffff; --panel-2: #f7f3ec; --line: #e9e2d6; --text: #1c1917; --muted: #655e58;
    --accent: #f59e0b; --on-accent: #1c1917; --ink: #b45309; --link: #92400e;
    --out: #fadf8f; --in: #ffffff; --chat-bg: #f6efe3; --hover: #faf6ef; --active: #f1eadf; --danger: #c81e1e;
    --shadow: rgba(28, 25, 23, .13); --thumb: rgba(120, 113, 108, .5); --thumb-hover: rgba(120, 113, 108, .8); --dots: rgba(120, 113, 108, .08);
  }
  /* Light is the default; dark follows the system setting unless the user chose light, and a chosen dark applies always (the button in the header sets
     data-theme on <html>, and the script in <head> restores it). The dark set is written twice because CSS cannot share it: a test keeps them identical. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0c0a09; --panel: #1c1917; --panel-2: #292524; --line: #3a3532; --text: #fafaf9; --muted: #a8a29e;
      --accent: #f59e0b; --on-accent: #1c1917; --ink: #fbbf24; --link: #fbbf24;
      --out: #512409; --in: #292524; --chat-bg: #14110f; --hover: #26211f; --active: #342e2b; --danger: #f87171;
      --shadow: rgba(0, 0, 0, .35); --thumb: rgba(168, 162, 158, .45); --thumb-hover: rgba(168, 162, 158, .75); --dots: rgba(168, 162, 158, .06);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0c0a09; --panel: #1c1917; --panel-2: #292524; --line: #3a3532; --text: #fafaf9; --muted: #a8a29e;
    --accent: #f59e0b; --on-accent: #1c1917; --ink: #fbbf24; --link: #fbbf24;
    --out: #512409; --in: #292524; --chat-bg: #14110f; --hover: #26211f; --active: #342e2b; --danger: #f87171;
    --shadow: rgba(0, 0, 0, .35); --thumb: rgba(168, 162, 158, .45); --thumb-hover: rgba(168, 162, 158, .75); --dots: rgba(168, 162, 158, .06);
  }
  ::selection { background: color-mix(in srgb, var(--accent) 45%, transparent); }
  textarea, input { caret-color: var(--accent); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { display: flex; height: 100dvh; width: 100%; background: var(--panel); } /* full width, like WhatsApp Web: no centred column */
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }


  /* mac-style scrollbars: thin, rounded, hidden until you hover or scroll */
  .list, .msgs, .md, .md pre, .md .table-wrap, .composer textarea { scrollbar-width: thin; scrollbar-color: transparent transparent; }
  .list:hover, .msgs:hover, .md:hover, .md pre:hover, .md .table-wrap:hover, .composer textarea:hover { scrollbar-color: var(--thumb) transparent; }
  .list::-webkit-scrollbar, .msgs::-webkit-scrollbar, .md::-webkit-scrollbar, .md pre::-webkit-scrollbar, .md .table-wrap::-webkit-scrollbar, .composer textarea::-webkit-scrollbar { width: 9px; height: 9px; }
  .list::-webkit-scrollbar-track, .msgs::-webkit-scrollbar-track, .md::-webkit-scrollbar-track, .md pre::-webkit-scrollbar-track, .md .table-wrap::-webkit-scrollbar-track, .composer textarea::-webkit-scrollbar-track { background: transparent; }
  .list::-webkit-scrollbar-thumb, .msgs::-webkit-scrollbar-thumb, .md::-webkit-scrollbar-thumb, .md pre::-webkit-scrollbar-thumb, .md .table-wrap::-webkit-scrollbar-thumb, .composer textarea::-webkit-scrollbar-thumb { background: transparent; border-radius: 9px; border: 2px solid transparent; background-clip: padding-box; }
  .list:hover::-webkit-scrollbar-thumb, .msgs:hover::-webkit-scrollbar-thumb, .md:hover::-webkit-scrollbar-thumb, .md pre:hover::-webkit-scrollbar-thumb, .md .table-wrap:hover::-webkit-scrollbar-thumb, .composer textarea:hover::-webkit-scrollbar-thumb { background-color: var(--thumb); }
  .list::-webkit-scrollbar-thumb:hover, .msgs::-webkit-scrollbar-thumb:hover, .md::-webkit-scrollbar-thumb:hover, .md pre::-webkit-scrollbar-thumb:hover, .md .table-wrap::-webkit-scrollbar-thumb:hover { background-color: var(--thumb-hover); }

  /* sidebar */
  .side { width: 380px; max-width: 40%; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
  .side header, .chat header { height: 59px; padding: 0 16px; background: var(--panel-2); display: flex; align-items: center; gap: 12px; flex: none; }
  .side h1 { font-size: 19px; font-weight: 600; margin: 0; flex: 1; }
  .acct { overflow: hidden; flex: none; }
  .acct img { width: 30px; height: 30px; border-radius: 50%; display: block; object-fit: cover; }
  .acct-initial { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 14px; }
  .acct-menu { position: fixed; z-index: 60; min-width: 200px; max-width: min(300px, calc(100vw - 16px)); padding: 12px; display: flex; flex-direction: column; gap: 2px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 8px 28px var(--shadow); }
  .acct-menu b { font-size: 14px; overflow-wrap: anywhere; }
  .acct-menu span { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; margin-bottom: 8px; }
  .acct-out { align-self: stretch; padding: 8px 10px; border-radius: 8px; text-align: left; font-size: 14px; background: var(--panel-2); }
  .acct-out:hover:not(:disabled) { background: var(--active); }
  .provider { margin-left: 0; max-width: 112px; font: inherit; font-size: 12px; color: var(--muted); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .icon-btn:hover { background: var(--active); }
  .icon-btn svg, .send svg, .meta svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn svg { width: 22px; height: 22px; }
  .search { padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .search input { width: 100%; border: 0; border-radius: 8px; background: var(--panel-2); color: var(--text); padding: 9px 14px; font: inherit; outline: none; }
  .list { overflow-y: auto; flex: 1; }
  .item { display: flex; gap: 14px; padding: 0 14px; align-items: center; width: 100%; text-align: left; height: 72px; }
  .item:hover { background: var(--hover); }
  .item.active { background: var(--active); }
  .item .body { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: center; }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .row .name { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .time { font-size: 12px; color: var(--muted); flex: none; }
  .preview { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .avatar { width: 49px; height: 49px; border-radius: 50%; flex: none; display: grid; place-items: center; color: #fff; font-weight: 600; font-size: 19px; overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .empty-list { padding: 40px 24px; text-align: center; color: var(--muted); }

  /* chat */
  .chat { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--chat-bg); position: relative; }
  .chat header { background: var(--panel-2); cursor: default; }
  .chat header .title { flex: 1; min-width: 0; }
  .chat header .title b { display: block; font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat header .title span { font-size: 13px; color: var(--muted); }
  .back { display: none; }
  .msgs { flex: 1; overflow-y: auto; padding: 18px max(4%, 16px); display: flex; flex-direction: column; gap: 3px;
    background-image: radial-gradient(circle at 20px 20px, var(--dots) 2px, transparent 3px); background-size: 40px 40px; }
  .bubble { max-width: min(75%, 640px); padding: 6px 9px 7px 10px; border-radius: 8px; box-shadow: 0 1px 0.5px var(--shadow); position: relative; word-wrap: break-word; overflow-wrap: anywhere; }
  .bubble.out { align-self: flex-end; background: var(--out); border-top-right-radius: 0; margin-top: 6px; }
  .bubble.in { align-self: flex-start; background: var(--in); border-top-left-radius: 0; margin-top: 6px; }
  .bubble.cont { margin-top: 3px; border-top-left-radius: 8px; border-top-right-radius: 8px; }
  .bubble .text { white-space: pre-wrap; }
  .bubble .text code { font: .9em ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(127, 127, 127, .2); padding: .08em .35em; border-radius: 4px; }
  .bubble .text.rich { white-space: normal; min-width: 0; }
  .bubble .text.rich > :first-child { margin-top: 0; }
  .bubble .text.rich > :last-child { margin-bottom: 0; }
  .bubble .text.rich p { margin: .3em 0; }
  .bubble .text.rich h1, .bubble .text.rich h2, .bubble .text.rich h3, .bubble .text.rich h4, .bubble .text.rich h5, .bubble .text.rich h6 { font-size: 1.05em; line-height: 1.3; margin: .55em 0 .25em; }
  .bubble .text.rich h1 { font-size: 1.15em; }
  .bubble .text.rich ul, .bubble .text.rich ol { margin: .3em 0; padding-left: 1.4em; }
  .bubble .text.rich li { margin: .1em 0; }
  .bubble .text.rich pre { background: rgba(127, 127, 127, .18); padding: 8px 10px; border-radius: 6px; overflow-x: auto; max-width: 100%; margin: .4em 0; font-size: .9em; scrollbar-width: thin; }
  .bubble .text.rich pre code { background: none; padding: 0; font-size: 1em; }
  .bubble .text.rich blockquote { margin: .4em 0; padding: 0 .8em; border-left: 3px solid var(--accent); color: var(--muted); }
  .bubble .text.rich hr { border: 0; border-top: 1px solid rgba(127, 127, 127, .4); margin: .6em 0; }
  .bubble .text.rich .table-wrap { overflow-x: auto; margin: .4em 0; max-width: 100%; scrollbar-width: thin; }
  .bubble .text.rich table { border-collapse: collapse; font-size: .92em; }
  .bubble .text.rich th, .bubble .text.rich td { border: 1px solid rgba(127, 127, 127, .4); padding: 3px 8px; text-align: left; vertical-align: top; }
  .bubble .text.rich th { font-weight: 600; }
  .bubble .text a.ext { color: var(--link); text-decoration: underline; }
  .bubble.pic { padding: 3px; }
  .bubble.pic img { display: block; max-width: 100%; max-height: 360px; border-radius: 6px; }
  .bubble .meta { float: right; margin: 6px 0 -4px 12px; font-size: 11px; color: var(--muted); display: flex; gap: 3px; align-items: center; }
  .bubble.err .text { color: var(--danger); }
  .typing { display: inline-flex; gap: 4px; padding: 6px 2px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .3; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }
  .day { align-self: center; background: var(--panel); color: var(--muted); font-size: 12.5px; padding: 5px 12px; border-radius: 8px; margin: 10px 0 4px; box-shadow: 0 1px 0.5px var(--shadow); }

  .composer { flex: none; display: flex; gap: 10px; align-items: flex-end; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--panel-2); }
  .composer textarea { flex: 1; resize: none; max-height: 140px; border: 0; border-radius: 8px; background: var(--panel); color: var(--text); padding: 10px 14px; font: inherit; outline: none; }
  .send { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; flex: none; }
  .send:disabled { opacity: .5; cursor: default; }
  .send svg { width: 22px; height: 22px; }
  .meta svg { width: 15px; height: 15px; }
  .status { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; font-style: italic; }
  .status svg { width: 15px; height: 15px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; animation: blink 1.2s infinite; }

  .welcome { margin: auto; text-align: center; color: var(--muted); max-width: 380px; padding: 24px; }
  .welcome h2 { color: var(--text); font-weight: 300; font-size: 28px; margin: 0 0 10px; }
  .welcome .primary { margin-top: 18px; background: var(--accent); color: var(--on-accent); border-radius: 24px; padding: 10px 22px; font-weight: 500; }
  .hidden { display: none !important; }


  /* document panel (right side) */
  .doc { width: 46%; max-width: 680px; flex: none; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; background: var(--panel); }
  .doc header { height: 59px; padding: 0 16px; background: var(--panel-2); display: flex; align-items: center; gap: 4px; flex: none; }
  .doc header .title { flex: 1; min-width: 0; }
  .doc header .title b { display: block; font-weight: 500; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .doc header .title span { font-size: 13px; color: var(--muted); }
  .md { flex: 1; overflow-y: auto; padding: 22px 28px 40px; line-height: 1.6; overflow-wrap: break-word; } /* break-word, not anywhere: anywhere shrinks table columns to single letters */
  .md > :first-child { margin-top: 0; }
  .md h1 { font-size: 1.7em; margin: 1.2em 0 .5em; line-height: 1.25; }
  .md h2 { font-size: 1.3em; margin: 1.4em 0 .5em; padding-bottom: .25em; border-bottom: 1px solid var(--line); }
  .md h3, .md h4, .md h5, .md h6 { font-size: 1.08em; margin: 1.2em 0 .4em; }
  .md p { margin: .7em 0; }
  .md ul, .md ol { margin: .6em 0; padding-left: 1.5em; }
  .md li { margin: .25em 0; }
  .md li > ul, .md li > ol { margin: .2em 0; }
  .md a { color: var(--link); text-decoration: underline; }
  .md code { font: 0.9em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--panel-2); padding: .1em .35em; border-radius: 4px; }
  .md pre { background: var(--panel-2); padding: 12px 14px; border-radius: 8px; overflow-x: auto; margin: .9em 0; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { margin: .9em 0; padding: .1em 1em; border-left: 3px solid var(--accent); color: var(--muted); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 1.4em 0; }
  .md .table-wrap { overflow-x: auto; margin: .9em 0; }
  .md table { border-collapse: collapse; width: 100%; font-size: .95em; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
  .md th { background: var(--panel-2); font-weight: 600; }
  .bubble.card { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 8px 12px; max-width: min(75%, 360px); }
  .formats { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 2px; }
  .formats .chip { padding: 8px 16px; border-radius: 18px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
  .formats .chip:hover { background: var(--hover); }
  .bubble.card:hover { background: var(--hover); }
  .bubble.card svg { width: 22px; height: 22px; flex: none; fill: none; stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .bubble.card b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bubble.card span { font-size: 12px; color: var(--muted); }
  .doc.wide { width: min(64%, 960px); max-width: none; }
  .doc-tools { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--line); flex: none; }
  .seg { display: inline-flex; background: var(--panel-2); border-radius: 8px; padding: 2px; gap: 2px; }
  .seg button { padding: 5px 10px; border-radius: 6px; font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
  .seg button.on { background: var(--panel); color: var(--text); box-shadow: 0 1px 2px var(--shadow); }
  .seg svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .mock-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .mock-stage { flex: 1; min-height: 0; display: flex; justify-content: center; padding: 14px; background: var(--panel-2); overflow: auto; }
  .mock-stage iframe { border: 0; background: #fff; border-radius: 8px; box-shadow: 0 2px 10px var(--shadow); max-width: 100%; width: 100%; height: 100%; min-height: 420px; }
  .mock-code { flex: 1; overflow: auto; margin: 0; padding: 16px; font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre; background: var(--panel); color: var(--text); tab-size: 2; scrollbar-width: thin; }
  @media (max-width: 1100px) { .app.doc-open .side { display: none; } }
  @media (max-width: 760px) {
    .doc { position: fixed; inset: 0; z-index: 3; width: 100%; max-width: none; border: 0; }
    .doc.wide { width: 100%; max-width: none; } /* a mockup panel is full screen on a phone too, like the Markdown viewer: .doc.wide above is stronger than .doc, so it needs its own line here */
    .md { padding: 18px 16px 40px; }
    .side { width: 100%; max-width: none; }
    .chat { position: fixed; inset: 0; z-index: 2; transform: translateX(100%); transition: transform .2s; }
    .app.in-chat .chat { transform: none; }
    .back { display: grid; }
  }

  /* the virtual office (office/*.js): a 3D view of the professionals at work, with a name tag on each. Opened with the Kantor button; the chat docks on the right. */
  .office { display: none; flex: 1; min-width: 0; flex-direction: column; background: var(--chat-bg); position: relative; }
  .app.office-mode .side { display: none; }
  .app.office-mode .office { display: flex; }
  .app.office-mode .back { display: grid; }
  .app.office-mode.doc-open .office { display: none; }
  .app.office-mode.doc-open .chat { flex: 1; }
  @media (min-width: 761px) {
    .app.office-mode:not(.in-chat) .chat { display: none; }
    .app.office-mode.in-chat:not(.doc-open) .chat { flex: none; width: 440px; max-width: 46%; border-left: 1px solid var(--line); }
  }
  .of-top { height: 59px; padding: 0 12px 0 16px; background: var(--panel-2); display: flex; align-items: center; gap: 12px; flex: none; border-bottom: 1px solid var(--line); }
  .office > .of-top { position: absolute; top: 0; left: 0; z-index: 6; width: 380px; max-width: 40%; height: auto; padding: 0; background: var(--panel); border-right: 1px solid var(--line); border-bottom: 0; display: flex; flex-direction: column; align-items: stretch; gap: 0; }
  .of-head { height: 59px; padding: 0 16px; background: var(--panel-2); display: flex; align-items: center; gap: 12px; flex: none; }
  .of-btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px 8px 11px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; font-weight: 600; flex: none; }
  .of-btn:hover { background: var(--hover); }
  .of-title { flex: 1; min-width: 0; }
  .of-title b { display: block; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .of-head .of-title b { font-size: 19px; }

<script>
const $ = (id) => document.getElementById(id);
const KEY = "islam-chat:v2";
// the professionals you can chat with (software house first, then social media); each has one conversation and its own persona file
const AGENTS = [
  { id: "po", name: "Raka", persona: "personas/po.md", avatar: "personas/raka.jpg", color: "#2563eb", about: "Software House · Product Owner" },
  { id: "ba", name: "Nadia", persona: "personas/ba.md", avatar: "personas/nadia.jpg", color: "#0891b2", about: "Software House · Business Analyst" },
  { id: "engineer", name: "Bima", persona: "personas/engineer.md", avatar: "personas/bima.jpg", color: "#4f46e5", about: "Software House · Software Engineer" },
  { id: "qa", name: "Sinta", persona: "personas/qa.md", avatar: "personas/sinta.jpg", color: "#059669", about: "Software House · QA / QC Engineer" },
  { id: "designer", name: "Kirana", persona: "personas/designer.md", avatar: "personas/kirana.jpg", color: "#c026d3", about: "Software House · UI / UX Designer" },
  { id: "devops", name: "Fajar", persona: "personas/devops.md", avatar: "personas/fajar.jpg", color: "#475569", about: "Software House · DevOps / SRE" },
  { id: "delivery", name: "Citra", persona: "personas/delivery.md", avatar: "personas/citra.jpg", color: "#0d9488", about: "Software House · Delivery Manager" },
  { id: "brand", name: "Arya", persona: "personas/brand.md", avatar: "personas/arya.jpg", color: "#ea580c", about: "Social Media · Brand Strategist" },
  { id: "planner", name: "Laras", persona: "personas/planner.md", avatar: "personas/laras.jpg", color: "#db2777", about: "Social Media · Content Planner" },
  { id: "smm", name: "Tara", persona: "personas/smm.md", avatar: "personas/tara.jpg", color: "#e11d48", about: "Social Media · Social Media Manager" },
  { id: "community", name: "Bayu", persona: "personas/community.md", avatar: "personas/bayu.jpg", color: "#b45309", about: "Social Media · Community Manager" },
  { id: "copywriter", name: "Salsa", persona: "personas/copywriter.md", avatar: "personas/salsa.jpg", color: "#7c3aed", about: "Social Media · Copywriter" },
  { id: "analyst", name: "Rendra", persona: "personas/analyst.md", avatar: "personas/rendra.jpg", color: "#0284c7", about: "Social Media · Social Media Analyst" },
];
const GROUPS = [
  { id: "group:software", key: "software", name: "Software House", avatar: "personas/group-software.jpg", color: "#2563eb", about: "Software House · 7 spesialis", members: ["po", "ba", "engineer", "qa", "designer", "devops", "delivery"] },
  { id: "group:social", key: "social", name: "Social Media", avatar: "personas/group-social.jpg", color: "#e11d48", about: "Social Media · 6 spesialis", members: ["brand", "planner", "smm", "community", "copywriter", "analyst"] },
  { id: "group:all", key: "all", name: "All", avatar: "personas/group-all.jpg", color: "#d97706", about: "Software House & Social Media · 13 spesialis", members: AGENTS.map((a) => a.id) },
];
const COORDINATOR = { id: "coordinator", name: "Koordinator", color: "#0f766e", about: "Koordinator Diskusi · Menyaring & merangkum" };
const groupOf = (id) => GROUPS.find((g) => g.id === id || g.key === id);
const isGroup = (id) => typeof id === "string" && id.startsWith("group:");
const targetOf = (id) => groupOf(id) ?? agentOf(id);

let state = { chats: [], current: null };
try { state = { ...state, ...JSON.parse(localStorage.getItem(KEY) || "{}") }; } catch {}
for (const a of [...AGENTS, ...GROUPS]) if (!state.chats.some((c) => c.id === a.id)) state.chats.push({ id: a.id, messages: [], updated: 0 });
state.chats = [...AGENTS, ...GROUPS].map((a) => state.chats.find((c) => c.id === a.id));
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };
const chatById = (id) => state.chats.find((c) => c.id === id);
const agentOf = (id) => AGENTS.find((a) => a.id === id);
const hhmm = (t) => new Date(t).toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit" });
const dayLabel = (t) => {
  const d = new Date(t), now = new Date();
  const diff = Math.round((new Date(now.getFullYear(), now.getMonth(), now.getDate()) - new Date(d.getFullYear(), d.getMonth(), d.getDate())) / 864e5);
  return diff === 0 ? "Hari ini" : diff === 1 ? "Kemarin" : d.toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" });
};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const API = "https://www.islam-gpt.org";
// The Worker that lets the AI use the internet and write documents (worker/pro.js): it runs the search/read-page loop so no key is on the page.
// To develop against the local proxy (node bin/proxy.js) open the page once with ?proxy=http://127.0.0.1:8787 (?proxy= alone goes back to the Worker).
// Only a localhost address is accepted, so a link can never point your chat at somebody else's server.
const WORKER = "https://pro-worker.situs.id";
const PROXY = (() => {
  try {
    const asked = new URLSearchParams(location.search).get("proxy");
    if (asked !== null) {
      if (/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/.test(asked)) localStorage.setItem("islam-chat:proxy", asked);
      else if (asked === "") localStorage.removeItem("islam-chat:proxy");
    }
    return localStorage.getItem("islam-chat:proxy") || WORKER;
  } catch { return WORKER; }
})();
const PROVIDERS = ["islam", "quran", "deepseek"];
let provider = "islam";   // the answer source: islam-gpt.org, quran-gpt.netlify.app or DeepSeek (all but islam-gpt only through the Worker: quran-gpt allows no other origin, DeepSeek runs there)
// DeepSeek is paid for: it is only restored (and only offered) once the Worker says this visitor may use it (see paintAccess)
try { const saved = localStorage.getItem("islam-chat:provider"); if (PROVIDERS.includes(saved) && saved !== "deepseek") provider = saved; } catch {}
const webOn = true;
// an anonymous id for this browser, made once
const DEVICE_ID = (() => {
  try {
    let id = localStorage.getItem("islam-chat:device");
    if (!id) { id = Array.from(crypto.getRandomValues(new Uint8Array(24)), (n) => "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789"[n % 62]).join(""); localStorage.setItem("islam-chat:device", id); }
    return id;
  } catch { return "anon" + Math.random().toString(36).slice(2, 20); }
})();
// the round avatar: the professional's picture, if they have one (avatar: in AGENTS; personas/<name>.jpg, made small and square by tools/make_image.py), else the first letter on the agent's colour
function paintAvatar(node, ag) {
  const letter = ag.name.charAt(0);
  node.style.background = ag.color;
  node.textContent = letter;
  if (!ag.avatar) return;
  const img = el("img");
  img.alt = "";
  img.onload = () => node.replaceChildren(img); // only swap the letter out once the picture is really there
  img.onerror = () => {}; // missing file: the letter stays
  img.src = ag.avatar;
}
const busy = new Set(); // chat ids with an answer in flight
const consults = new Map(); // asker id -> {to, toName}: a professional is putting a question to a colleague right now (shown in the office as a visit)

const PLAYBOOK_COLORS = { website: "#c026d3", software: "#2563eb", campaign: "#e11d48" };
const PLAYBOOK_NAMES = { website: "Website / Landing Page", software: "Aplikasi / Fitur", campaign: "Kampanye Media Sosial" };
const PJ_STATUS_NAMES = { draft: "Belum dimulai", running: "Berjalan", paused: "Dijeda", failed: "Perlu dicoba lagi", done: "Selesai" };
function fallbackProjectList() {
  try {
    return (JSON.parse(localStorage.getItem("islam-chat:projects:v1") || "[]") || [])
      .filter((p) => p && typeof p.id === "string" && Array.isArray(p.plan))
      .map((p) => {
        const total = p.plan.length || 1;
        const done = p.plan.filter((s) => p.steps?.[s.id]?.status === "done").length;
        return { id: p.id, title: p.title || "Proyek", goal: p.goal || "", playbook: p.playbook, playbookTitle: PLAYBOOK_NAMES[p.playbook] ?? p.playbook ?? "Proyek", status: p.status, statusLabel: PJ_STATUS_NAMES[p.status] ?? p.status ?? "", updatedAt: p.updatedAt || 0, done, total };
      });
  } catch { return []; }
}
function renderProjectHeader() {
  const cur = projectView?.current ?? null;
  const hav = $("pj-hav"), htitle = $("pj-htitle"), hsub = $("pj-sub"), btnNew = $("pj-new"), btnDel = $("pj-del");
  if (!hav || !htitle || !hsub) return;
  if (cur) {
    const items = projectView?.list ?? fallbackProjectList();
    const info = items.find((x) => x.id === cur.id);
    const done = info?.done ?? 0, total = info?.total ?? (cur.plan?.length || 1);
    const pbTitle = info?.playbookTitle ?? PLAYBOOK_NAMES[cur.playbook] ?? cur.playbook;
    const stLabel = info?.statusLabel ?? PJ_STATUS_NAMES[cur.status] ?? cur.status;
    hav.style.background = PLAYBOOK_COLORS[cur.playbook] ?? "#d97706";
    hav.style.color = "#fff";
    hav.textContent = (cur.title || "P").charAt(0).toUpperCase();
    htitle.textContent = cur.title;
    hsub.textContent = cur.status === "running" ? `berjalan · ${done}/${total} langkah…` : `${pbTitle} · ${stLabel} (${done}/${total} langkah)`;
    btnNew?.classList.remove("hidden");
    btnDel?.classList.remove("hidden");
  } else {
    hav.style.background = "var(--accent)";
    hav.style.color = "var(--on-accent)";
    hav.textContent = "+";
    htitle.textContent = "Proyek Baru";
    hsub.textContent = "Beri satu tujuan, tim mengerjakannya bersama";
    btnNew?.classList.add("hidden");
    btnDel?.classList.add("hidden");
  }
}

function renderList() {
  const q = $("q").value.trim().toLowerCase();
  const list = $("list");
  list.replaceChildren();
  const sideTitle = document.querySelector(".side h1");
  if (sideTitle) sideTitle.textContent = projectOn ? "Proyek" : discussionOn ? "Diskusi" : "Chat";
  $("q").placeholder = projectOn ? "Cari proyek" : discussionOn ? "Cari grup diskusi" : "Cari percakapan";
  if (projectOn) {
    const curId = projectView?.current?.id ?? null;
    const createBtn = el("button", "item pj-new-item" + (!curId ? " active" : ""));
    const createAv = el("div", "avatar", "+");
    createAv.style.background = "var(--accent)";
    createAv.style.color = "var(--on-accent)";
    const createBody = el("div", "body");
    const createRow = el("div", "row");
    createRow.append(el("span", "name", "Proyek baru"));
    createBody.append(createRow, el("div", "preview", "Beri satu tujuan, tim mengerjakannya bersama"));
    createBtn.append(createAv, createBody);
    createBtn.onclick = () => { closePanels(); projectView?.newProject(); $("app").classList.add("in-project"); };
    list.append(createBtn);

    const allProjects = projectView?.list ?? fallbackProjectList();
    const filtered = allProjects.filter((p) => !q || (p.title + " " + p.goal + " " + p.playbookTitle).toLowerCase().includes(q));
    if (!filtered.length) {
      list.append(el("div", "empty-list", q ? "Tidak ada hasil." : "Belum ada riwayat proyek."));
    }
    for (const p of filtered) {
      const b = el("button", "item" + (p.id === curId ? " active" : ""));
      const av = el("div", "avatar", (p.title || "P").charAt(0).toUpperCase());
      av.style.background = PLAYBOOK_COLORS[p.playbook] ?? "#d97706";
      const body = el("div", "body");
      const row = el("div", "row");
      row.append(el("span", "name", p.title), el("span", "time", p.updatedAt ? hhmm(p.updatedAt) : ""));
      const prev = p.status === "running" ? `berjalan · ${p.done}/${p.total} langkah…` : `${p.playbookTitle} · ${p.statusLabel} (${p.done}/${p.total} langkah)`;
      body.append(row, el("div", "preview", prev));
      b.append(av, body);
      b.onclick = () => { closePanels(); projectView?.open(p.id); $("app").classList.add("in-project"); };
      list.append(b);
    }
    renderProjectHeader();
    return;
  }
  const wTitle = document.querySelector("#welcome h2"), wSub = document.querySelector("#welcome div");
  if (wTitle) wTitle.textContent = discussionOn ? "Ruang Diskusi Tim" : "Tim Profesional AI";
  if (wSub) wSub.textContent = discussionOn ? "Pilih grup di sebelah kiri (Software House, Social Media, atau All). Koordinator akan memilih spesialis yang relevan, berdiskusi 2 putaran di meja rapat, lalu menyimpulkan." : "Pilih rekan di sebelah kiri untuk mulai berdiskusi — dari riset produk, desain, sampai penulisan kode.";
  const pool = state.chats.filter((c) => isGroup(c.id) === Boolean(discussionOn));
  const chats = (discussionOn ? [...pool] : [...pool].sort((a, b) => b.updated - a.updated)).filter((c) => !q || (targetOf(c.id).name + " " + targetOf(c.id).about).toLowerCase().includes(q));
  if (!chats.length) list.append(el("div", "empty-list", "Tidak ada hasil."));
  for (const c of chats) {
    const last = c.messages[c.messages.length - 1];
    const b = el("button", "item" + (c.id === state.current ? " active" : ""));
    const ag = targetOf(c.id);
    const av = el("div", "avatar");
    paintAvatar(av, ag);
    const body = el("div", "body");
    const row = el("div", "row");
    row.append(el("span", "name", ag.name), el("span", "time", last ? hhmm(last.t) : ""));
    body.append(row, el("div", "preview", busy.has(c.id) ? (isGroup(c.id) ? "berdiskusi di ruang rapat…" : "mengetik…") : ag.about));
    b.append(av, body);
    b.onclick = () => open(c.id);
    list.append(b);
  }
  if (officeReady && officeOn) renderRoster();
}

// links: [text](url) and bare URLs become <a> (http(s) only, opens in a new tab). A bare URL may omit the scheme
// (www.wikipedia.org, wikipedia.org/wiki/X when it ends in a common TLD); https:// is added to the href.
const TLD = "com|org|net|edu|gov|info|io|co|id|me|ai|app|dev|xyz|tv|my|sg|uk|us|au|de|jp";
const LINK = new RegExp(
  String.raw`(\[[^\]\n]+\]\((?:https?:\/\/|www\.)[^\s)]+\)|(?:https?:\/\/|www\.)[^\s<>"]+|(?<![\w@./-])(?:[a-z0-9-]+\.)+(?:${TLD})(?![\w-])(?:\/[^\s<>"]*)?)`,

const setDocUrl = (html, url) => { if (docView?.kind === "mockup" && docView.html === html) { docView.url = url; paintDocLink(); } };
const openDoc = (d) => {
  docView = d;
  if (d.kind === "mockup") { d.svg ??= isSvg(d.html); mockTab = "preview"; mockWidth = 0; mockBg = "light"; }
  renderDoc();
  // every page shown here goes to the bucket at once (the same page only once), so "open in a new window" goes straight to its own address
  if (d.kind === "mockup" && !(d.url && PUBLISHED_PAGE.test(d.url))) previewUrl(d).then((url) => { if (!(d.url && PUBLISHED_PAGE.test(d.url))) d.url = url; if (docView === d) paintDocLink(); }).catch(() => { /* the button uploads it again when clicked */ });
};
const closeDoc = () => { docView = null; $("mock-body").replaceChildren(); renderDoc(); }; // an emptied panel also stops a running preview
function docCard(d) {
  const mock = d.kind === "mockup";
  const b = el("button", "bubble in cont card");
  b.type = "button";
  b.insertAdjacentHTML("afterbegin", mock ? ICON_LAYOUT : ICON_FILE_TEXT); // constant markup
  const t = el("div"); t.append(el("b", null, d.title), el("span", null, !mock ? "Buka dokumen" : d.svg || isSvg(d.html) ? "Pratinjau SVG" : "Buka mockup"));
  b.append(t);
  b.onclick = () => openDoc(d);
  return b;
}

// When the AI cannot tell what kind of answer is wanted it asks (the `formats` event): three buttons, each sends the choice as the next message.
// The words matter: "dokumen" and "website" are trigger words of the writing-md and mockup-html skills, which are then loaded for the answer.
const FORMATS = [["Chat", "Jawab sebagai chat biasa saja."], ["Dokumen", "Buatkan sebagai dokumen."], ["Website", "Buatkan sebagai website (mockup)."]];
function formatChoices() {
  const row = el("div", "formats");
  for (const [label, message] of FORMATS) {
    const b = el("button", "chip", label);
    b.type = "button";
    b.onclick = () => sendMessage(message);
    row.append(b);
  }
  return row;
}

function scrollDown() { const m = $("msgs"); m.scrollTop = m.scrollHeight; }

function renderChat() {
  const c = chatById(state.current);
  for (const id of ["head", "msgs", "form"]) $(id).classList.toggle("hidden", !c);
  $("welcome").classList.toggle("hidden", !!c);
  $("app").classList.toggle("in-chat", !!c);
  if (!c) return;
  const ag = targetOf(c.id);
  $("htitle").textContent = ag.name;
  paintAvatar($("hav"), ag);
  const role = ag.about.includes(" · ") ? ag.about.split(" · ").slice(1).join(" · ") : ag.about;
  $("hsub").textContent = busy.has(c.id) ? (isGroup(c.id) ? "berdiskusi di ruang rapat…" : "mengetik…") : isGroup(c.id) ? ag.about : `online · ${role}`;
  const box = $("msgs");
  box.replaceChildren();
  let day = "";
  for (const m of c.messages) {
    const d = dayLabel(m.t);
    if (d !== day) { day = d; box.append(el("div", "day", d)); }
    box.append(...bubbles(m));
    for (const g of extractSvgs(m.text)) box.append(docCard(svgDoc(g)));
    for (const i of m.images ?? []) box.append(picture(i));
    for (const d of m.docs ?? []) box.append(docCard({ kind: "doc", ...d }));
    for (const k of m.mockups ?? []) box.append(docCard({ kind: "mockup", ...k }));
    if (m.formats && m === c.messages.at(-1) && !busy.has(c.id)) box.append(formatChoices());
  }
  scrollDown();
  $("send").disabled = busy.has(c.id);
}

function open(id) { if (officeOn && meetingBusy.has(id)) id = meetingBusy.get(id).groupId; closeDoc(); state.current = id; save(); renderList(); renderChat(); if (matchMedia("(min-width: 761px)").matches) $("input").focus(); }

// the agent's persona file is put in front of every question: the API has no memory, so a persona sent only once would be forgotten
const personas = {};
const loadPersona = (a) => (personas[a.id] ??= fetch(a.persona).then((r) => (r.ok ? r.text() : "")).then((s) => s.trim()).catch(() => ""));

// The API answers each question on its own, so a follow-up carries the recent turns inside the question text.
const HISTORY_TURNS = 6, HISTORY_ANSWER_CHARS = 500, HISTORY_TOTAL_CHARS = 2500;
function withHistory(c, question, persona) {
  const name = targetOf(c.id).name;
  const turns = c.messages.filter((m) => !m.error && !m.pending && m.text).slice(-HISTORY_TURNS * 2);
  let lines = turns.map((m) => (m.role === "user" ? "User: " : name + ": ") + (m.role === "user" ? m.text : m.text.slice(0, HISTORY_ANSWER_CHARS)));
  while (lines.length && lines.join("\n").length > HISTORY_TOTAL_CHARS) lines.shift();
  const parts = [];
  if (persona) parts.push(persona);
  if (lines.length) parts.push(`Earlier in this chat (background only, do not mention it):\n${lines.join("\n")}`);
  if (!parts.length) return question;
  return `${parts.join("\n\n")}\n\nUser's ${lines.length ? "new" : "first"} message: ${question}\n\n(Reply in the language of the user's message just above, not the language of the earlier chat.)`;
}

function groupHistoryText(c) {
  const turns = c.messages.filter((m) => !m.error && !m.pending && m.text).slice(-HISTORY_TURNS * 2);
  const lines = turns.map((m) => {
    const who = m.role === "user" ? "User" : m.speaker === "coordinator" ? "Koordinator" : agentOf(m.speaker)?.name ?? "Spesialis";
    return `${who}: ${m.role === "user" ? m.text : m.text.slice(0, HISTORY_ANSWER_CHARS)}`;
  });
  while (lines.length && lines.join("\n").length > HISTORY_TOTAL_CHARS) lines.shift();
  return lines.join("\n");
}

async function runTurn({ c, prompt, persona = "", text = "", reply, bufferOnly = false, update }) {
  const chatId = c.groupId ?? c.id;
  const useWorker = webOn || provider !== "islam";
  let res;
  if (useWorker) {
    // through the local proxy, which lets the model search the web and streams back the same SSE events
    res = await fetch(PROXY + "/agent", authInit({ method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ deviceId: DEVICE_ID, question: prompt, persona, message: text.trim(), provider, agent: c.id }) })).catch(() => { throw new Error(PROXY === WORKER ? "layanan internet tidak bisa dihubungi, coba lagi" : "proxy lokal tidak jalan (node bin/proxy.js)"); });
    if (res.status === 429 && isGroup(chatId) && provider === "islam") {
      const fullPrompt = persona ? `${persona}\n\n${prompt}` : prompt;
      const q = await fetch(API + "/api/questions", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ deviceId: DEVICE_ID, question: fullPrompt }) });
      if (q.ok) {
        const { shareId } = await q.json();
        if (shareId) res = await fetch(API + "/api/stream/" + encodeURIComponent(shareId), { headers: { Accept: "text/event-stream" } });
      }
    }
    if (res.status === 429) throw new Error("terlalu banyak pertanyaan, tunggu sebentar lalu coba lagi");
  } else {
    // straight to islam-gpt.org (it allows any origin): POST the question, then read the answer as SSE
    const q = await fetch(API + "/api/questions", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ deviceId: DEVICE_ID, question: prompt }) });
    if (!q.ok) throw new Error("HTTP " + q.status);
    const { shareId } = await q.json();
    if (!shareId) throw new Error("no shareId");
    res = await fetch(API + "/api/stream/" + encodeURIComponent(shareId), { headers: { Accept: "text/event-stream" } });
  }
  if (!res.ok) throw new Error("HTTP " + res.status);
  const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
  let buf = "", rawText = "";
  read: for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += value;
    const blocks = buf.split(/\r?\n\r?\n/);
    buf = blocks.pop();
    for (const blk of blocks) {
      const data = blk.split(/\r?\n/).filter((l) => l.startsWith("data:")).map((l) => l.slice(5).replace(/^ /, "")).join("\n");
      if (!data) continue;
      const ev = JSON.parse(data);
      if (ev.type === "chunk") {
        rawText += ev.text;
        if (!bufferOnly) { reply.text += ev.text; reply.t = Date.now(); update(); }
      }
      else if (ev.type === "image" && /^https:\/\/(upload|thumb)\.wikimedia\.org\//.test(ev.url) && /^https:\/\//.test(ev.page)) { (reply.images ??= []).push({ url: ev.url, title: String(ev.title), credit: String(ev.credit ?? ""), page: ev.page }); update(); }
      else if (ev.type === "document" && typeof ev.markdown === "string") {
        const d = { title: String(ev.title || "Dokumen").slice(0, 120), markdown: ev.markdown.slice(0, 100000) };
        (reply.docs ??= []).push(d);
        if (state.current === chatId) openDoc({ kind: "doc", ...d }); // show it on the right as soon as it arrives
        update();
      }
      else if (ev.type === "mockup" && typeof ev.html === "string") {
        const k = { title: String(ev.title || "Mockup").slice(0, 120), html: ev.html };
        (reply.mockups ??= []).push(k);
        if (state.current === chatId) openDoc({ kind: "mockup", ...k }); // show it on the right as soon as it arrives
        update();
      }
      else if (ev.type === "formats" && !isGroup(chatId)) { reply.formats = true; update(); }
      else if (ev.type === "consult" && typeof ev.to === "string" && !isGroup(chatId)) { if (ev.phase === "start") consults.set(c.id, { to: ev.to, toName: String(ev.toName ?? "") }); else consults.delete(c.id); update(); }
      else if (ev.type === "tool") { reply.status = ev.phase === "start" ? toolStatus(ev) : "menulis jawaban…"; update(); }
      else if (ev.type === "error") throw new Error(ev.message);
      else if (ev.type === "done") { reader.cancel(); break read; }
    }
  }
  return rawText;
}

function releaseMeetingAfterHold(groupId, ids, holdMs = 25000) {
  for (const id of ids) {
    const cur = meetingBusy.get(id);
    if (cur?.groupId === groupId) meetingBusy.set(id, { groupId, status: "selesai rapat ✓" });
  }
  setTimeout(() => {
    let changed = false;
    for (const id of ids) {
      const cur = meetingBusy.get(id);
      if (cur?.groupId === groupId && cur.status === "selesai rapat ✓") { meetingBusy.delete(id); changed = true; }
    }
    if (changed && officeReady && officeOn) renderRoster();
  }, holdMs);
}

async function runGroupRound3(c, userAnswer) {
  const r3State = c.round3State;
  delete c.round3State;
  const picked = r3State.agents ?? [];
  const now = Date.now();
  c.messages.push({ role: "user", text: userAnswer, t: now });
  c.updated = now;
  busy.add(c.id);
  meetingBusy.set("coordinator", { groupId: c.id, status: "memandu putaran 3 di meja rapat…" });
  for (const id of picked) meetingBusy.set(id, { groupId: c.id, status: "duduk di meja rapat (putaran 3)…" });
  save(); renderList(); renderChat();
  const update = () => { if (state.current === c.id) renderChat(); renderList(); };
  try {
    const { buildRound3Prompt, buildFinalSummaryPrompt } = await import("./src/discuss.js");
    const round3 = [];
    for (const id of picked) {
      const ag = agentOf(id);
      if (!ag) continue;
      const persona = await loadPersona(ag);
      const useWorker = webOn || provider !== "islam";
      const baseR3 = buildRound3Prompt({
        question: r3State.question,
        coordinatorQuestions: r3State.coordinatorText,
        userAnswer,
        groupId: c.id,
        agentId: id,
        round1: r3State.round1,
        round2: r3State.round2,
        round3SoFar: round3,
      });
      const r3Prompt = !useWorker && persona ? `${persona}\n\n${baseR3}` : baseR3;
      const msg = { role: "bot", speaker: id, round: "Putaran 3", text: "", status: `${ag.name} menyusun rekomendasi akhir…`, t: Date.now(), pending: true };
      c.messages.push(msg);
      meetingBusy.set(id, { groupId: c.id, status: "berbicara (putaran 3)…" });
      update();
      try {
        await runTurn({ c: { id, groupId: c.id }, prompt: r3Prompt, persona: useWorker ? persona : "", text: userAnswer, reply: msg, update });
        if (!msg.text && !msg.docs?.length && !msg.mockups?.length && !msg.images?.length) msg.text = "(Tidak ada tambahan.)";
      } catch (e) {
        msg.error = true;
        msg.text = (msg.text ? msg.text + "\n\n" : "") + "Gagal: " + e.message;
      }
      delete msg.pending; delete msg.status; msg.t = Date.now(); c.updated = msg.t;
      const drawn = msg.error ? [] : extractSvgs(msg.text);
      if (drawn.length && !msg.mockups?.length && state.current === c.id) openDoc(svgDoc(drawn[0]));
      if (!msg.error && (msg.text || msg.docs?.length || msg.mockups?.length)) round3.push({ id, text: msg.text, docs: msg.docs, mockups: msg.mockups });
      meetingBusy.set(id, { groupId: c.id, status: "menyimak di meja rapat…" });
      consults.delete(id);
      save(); update();
    }
    if (round3.length > 0) {
      const sumMsg = { role: "bot", speaker: "coordinator", round: "Ringkasan Koordinator (Putaran 3)", text: "", status: "menyusun kesimpulan akhir…", t: Date.now(), pending: true };
      c.messages.push(sumMsg);
      meetingBusy.set("coordinator", { groupId: c.id, status: "merangkum kesimpulan akhir…" });
      update();
      try {
        const sumPrompt = buildFinalSummaryPrompt({ question: r3State.question, userAnswer, groupId: c.id, round1: r3State.round1, round2: r3State.round2, round3 });
        await runTurn({ c, prompt: sumPrompt, persona: "", text: "", reply: sumMsg, update });
        if (!sumMsg.text) throw new Error("Tidak ada ringkasan.");
      } catch (e) {
        sumMsg.error = true;
        sumMsg.text = (sumMsg.text ? sumMsg.text + "\n\n" : "") + "Gagal: " + e.message;
      }
      delete sumMsg.pending; delete sumMsg.status; sumMsg.t = Date.now(); c.updated = sumMsg.t;
    }
  } finally {
    for (const id of picked) consults.delete(id);
    releaseMeetingAfterHold(c.id, ["coordinator", ...picked]);
    busy.delete(c.id);
    save(); update();
  }
}

async function sendGroupMessage(c, question) {
  const g = groupOf(c.id);
  if (!g) return;
  if (c.round3State?.agents?.length) return runGroupRound3(c, question);
  const history = groupHistoryText(c);
  const now = Date.now();
  c.messages.push({ role: "user", text: question, t: now });
  const coordMsg = { role: "bot", speaker: "coordinator", round: "Koordinator", text: "", status: "memilih spesialis untuk diskusi…", t: Date.now(), pending: true };
  c.messages.push(coordMsg);
  c.updated = now;
  busy.add(c.id);
  meetingBusy.set("coordinator", { groupId: c.id, status: "memilih spesialis di meja rapat…" });
  for (const id of g.members) meetingBusy.set(id, { groupId: c.id, status: "menuju meja rapat…" });
  save(); renderList(); renderChat();
  const update = () => { if (state.current === c.id) renderChat(); renderList(); };
  let picked = [];
  try {
    const { buildScreenPrompt, parseScreenReply, buildRound1Prompt, buildRound2Prompt, isPassReply, buildSummaryPrompt, extractNumberedQuestions, hasNumberedQuestions } = await import("./src/discuss.js");
    const screenRaw = await runTurn({ c, prompt: buildScreenPrompt(question, c.id), reply: coordMsg, bufferOnly: true, update });
    const screen = parseScreenReply(screenRaw, c.id, question);
    coordMsg.text = screen.intro;
    delete coordMsg.pending; delete coordMsg.status; coordMsg.t = Date.now(); c.updated = coordMsg.t;
    save(); update();
    if (!screen.answerable || !screen.agents.length) {
      for (const id of ["coordinator", ...g.members]) meetingBusy.delete(id);
      return;
    }
    picked = screen.agents;
    for (const id of g.members) {
      if (!picked.includes(id)) meetingBusy.delete(id);
    }
    meetingBusy.set("coordinator", { groupId: c.id, status: "memandu diskusi di meja rapat…" });
    for (const id of picked) meetingBusy.set(id, { groupId: c.id, status: "duduk di meja rapat…" });
    update();

    // Round 1: every picked specialist answers from their perspective
    const round1 = [];
    for (const id of picked) {
      const ag = agentOf(id);
      if (!ag) continue;
      const persona = await loadPersona(ag);
      const useWorker = webOn || provider !== "islam";
      const baseR1 = buildRound1Prompt({
        question,
        groupId: c.id,
        agentId: id,
        pickedIds: picked,
        round1SoFar: round1,
        history,
      });
      const r1Prompt = !useWorker && persona ? `${persona}\n\n${baseR1}` : baseR1;
      const msg = { role: "bot", speaker: id, round: "Putaran 1", text: "", status: `${ag.name} menyampaikan pandangan…`, t: Date.now(), pending: true };
      c.messages.push(msg);
      meetingBusy.set(id, { groupId: c.id, status: "berbicara (putaran 1)…" });
      update();
      try {
        await runTurn({ c: { id, groupId: c.id }, prompt: r1Prompt, persona: useWorker ? persona : "", text: question, reply: msg, update });
        if (!msg.text && !msg.docs?.length && !msg.mockups?.length && !msg.images?.length) msg.text = "(Tidak ada tambahan.)";
      } catch (e) {
        msg.error = true;
        msg.text = (msg.text ? msg.text + "\n\n" : "") + "Gagal: " + e.message;
      }
      delete msg.pending; delete msg.status; msg.t = Date.now(); c.updated = msg.t;
      const drawn = msg.error ? [] : extractSvgs(msg.text);
      if (drawn.length && !msg.mockups?.length && state.current === c.id) openDoc(svgDoc(drawn[0]));
      if (!msg.error && (msg.text || msg.docs?.length || msg.mockups?.length)) round1.push({ id, text: msg.text, docs: msg.docs, mockups: msg.mockups });
      meetingBusy.set(id, { groupId: c.id, status: "menyimak di meja rapat…" });
      consults.delete(id);
      save(); update();
    }

    // Round 2: each specialist hears all Round 1 thoughts; adding a message is optional (<pass/> skips)
    const round2 = [];
    if (round1.length > 0) {
      for (const id of picked) {
        const ag = agentOf(id);
        if (!ag) continue;
        const persona = await loadPersona(ag);
        const useWorker = webOn || provider !== "islam";
        const baseR2 = buildRound2Prompt({
          question,
          groupId: c.id,
          agentId: id,
          round1,
          round2SoFar: round2,
        });
        const r2Prompt = !useWorker && persona ? `${persona}\n\n${baseR2}` : baseR2;
        const msg = { role: "bot", speaker: id, round: "Putaran 2", text: "", status: `${ag.name} menimbang tanggapan…`, t: Date.now(), pending: true };
        c.messages.push(msg);
        meetingBusy.set(id, { groupId: c.id, status: "menanggapi (putaran 2)…" });
        update();
        let rawR2 = "";
        try {
          rawR2 = await runTurn({ c: { id, groupId: c.id }, prompt: r2Prompt, persona: useWorker ? persona : "", text: "", reply: msg, bufferOnly: true, update });
        } catch {
          rawR2 = "<pass/>";
        }
        consults.delete(id);
        const hasAttachment = Boolean(msg.docs?.length || msg.mockups?.length || msg.images?.length);
        if (isPassReply(rawR2) && !hasAttachment) {
          const idx = c.messages.indexOf(msg);
          if (idx !== -1) c.messages.splice(idx, 1);
        } else {
          msg.text = rawR2.replace(/<\s*pass\s*\/?\s*>/gi, "").trim() || "(Melampirkan hasil tambahan.)";
          delete msg.pending; delete msg.status; msg.t = Date.now(); c.updated = msg.t;
          const drawn = extractSvgs(msg.text);
          if (drawn.length && !msg.mockups?.length && state.current === c.id) openDoc(svgDoc(drawn[0]));
          round2.push({ id, text: msg.text, docs: msg.docs, mockups: msg.mockups });
        }
        meetingBusy.set(id, { groupId: c.id, status: "menyimak di meja rapat…" });
        save(); update();
      }
    }

    // Coordinator summary: only after Round 2 is over
    if (round1.length > 0) {
      const sumMsg = { role: "bot", speaker: "coordinator", round: "Ringkasan Koordinator", text: "", status: "menyusun kesimpulan diskusi…", t: Date.now(), pending: true };
      c.messages.push(sumMsg);
      meetingBusy.set("coordinator", { groupId: c.id, status: "merangkum hasil diskusi…" });
      update();
      const numbered = extractNumberedQuestions(round1, round2);
      try {
        const sumPrompt = buildSummaryPrompt({ question, groupId: c.id, round1, round2 });
        await runTurn({ c, prompt: sumPrompt, persona: "", text: "", reply: sumMsg, update });
        if (!sumMsg.text) throw new Error("Tidak ada ringkasan.");
        if (numbered && !hasNumberedQuestions(sumMsg.text)) {
          sumMsg.text = `${sumMsg.text.trim()}\n\nPertanyaan dari tim untuk dilanjutkan ke Putaran 3:\n${numbered}\n\nSilakan jawab pertanyaan di atas untuk masuk ke Putaran 3.`;
        }
      } catch (e) {
        if (numbered) {
          sumMsg.text = (sumMsg.text ? sumMsg.text.trim() + "\n\n" : "") + `Ringkasan pertanyaan dari tim untuk dilanjutkan ke Putaran 3:\n\n${numbered}\n\nSilakan jawab pertanyaan di atas untuk masuk ke Putaran 3.`;
        } else {
          sumMsg.error = true;
          sumMsg.text = (sumMsg.text ? sumMsg.text + "\n\n" : "") + "Gagal: " + e.message;
        }
      }
      delete sumMsg.pending; delete sumMsg.status; sumMsg.t = Date.now(); c.updated = sumMsg.t;
      if (!sumMsg.error && hasNumberedQuestions(sumMsg.text)) {
        c.round3State = { question, agents: picked, round1, round2, coordinatorText: sumMsg.text };
      }
    }
  } catch (e) {
    coordMsg.error = true;
    coordMsg.text = (coordMsg.text ? coordMsg.text + "\n\n" : "") + "Gagal: " + e.message;
    delete coordMsg.pending; delete coordMsg.status;
  } finally {
    for (const id of picked) consults.delete(id);
    if (c.round3State?.agents?.length) {
      meetingBusy.set("coordinator", { groupId: c.id, status: "menunggu jawaban untuk Putaran 3…" });
      for (const id of c.round3State.agents) meetingBusy.set(id, { groupId: c.id, status: "menunggu jawaban untuk Putaran 3…" });
    } else if (picked.length) {
      releaseMeetingAfterHold(c.id, ["coordinator", ...picked]);
    } else {
      for (const id of ["coordinator", ...g.members]) meetingBusy.delete(id);
    }
    busy.delete(c.id);
    save(); update();
  }
}

async function sendMessage(text) {
  const c = chatById(state.current);
  if (!c || busy.has(c.id) || !text.trim()) return;
  if (isGroup(c.id)) return sendGroupMessage(c, text.trim());
  const persona = await loadPersona(agentOf(c.id));
  // with internet on, the proxy gets the persona separately so it can restate it after every tool result
  const useWorker = webOn || provider !== "islam";
  const prompt = withHistory(c, text.trim(), useWorker ? "" : persona);
  const now = Date.now();
  c.messages.push({ role: "user", text: text.trim(), t: now });
  const reply = { role: "bot", text: "", t: Date.now(), pending: true };
  c.messages.push(reply);
  c.updated = now;
  busy.add(c.id);
  save(); renderList(); renderChat();

  const update = () => { if (state.current === c.id) { renderChat(); } renderList(); };
  try {
    await runTurn({ c, prompt, persona, text, reply, update });
    if (!reply.text) throw new Error("Tidak ada jawaban.");
